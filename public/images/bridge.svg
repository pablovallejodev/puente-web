<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2f6d0"/>
      <stop offset="55%" stop-color="#d0e1d4"/>
      <stop offset="100%" stop-color="#d9d2b6"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c5d6ca"/>
      <stop offset="100%" stop-color="#aebfae"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e4be9e"/>
      <stop offset="45%" stop-color="#d9d2b6"/>
      <stop offset="100%" stop-color="#b8ae95"/>
    </linearGradient>
    <linearGradient id="stone-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c4b89a"/>
      <stop offset="100%" stop-color="#71697a"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- distant hills -->
  <path fill="#c5d4c0" d="M0 520 C220 470 380 490 560 510 C780 535 980 470 1200 500 C1380 520 1500 490 1600 505 L1600 900 L0 900 Z"/>
  <path fill="#b7c6b4" opacity="0.7" d="M0 560 C300 530 500 580 760 555 C1050 525 1300 560 1600 540 L1600 900 L0 900 Z"/>

  <!-- water -->
  <ellipse cx="800" cy="780" rx="620" ry="90" fill="url(#water)" opacity="0.85"/>
  <path fill="none" stroke="#e4be9e" stroke-width="1.5" opacity="0.35" d="M260 760 Q500 740 800 765 T1340 755"/>
  <path fill="none" stroke="#f2f6d0" stroke-width="1.2" opacity="0.4" d="M300 790 Q600 775 820 792 T1280 785"/>

  <!-- bridge deck shadow -->
  <path fill="#71697a" opacity="0.18" d="M220 560 L1380 560 L1360 590 L240 590 Z"/>

  <!-- main arch fill (void / water through) -->
  <path fill="url(#water)" d="M420 560 C420 560 520 360 800 360 C1080 360 1180 560 1180 560 Z"/>

  <!-- stone piers -->
  <path fill="url(#stone)" stroke="#71697a" stroke-width="2" d="M250 560 L420 560 L420 720 L280 740 Z"/>
  <path fill="url(#stone)" stroke="#71697a" stroke-width="2" d="M1180 560 L1350 560 L1320 740 L1180 720 Z"/>

  <!-- arch ring -->
  <path fill="none" stroke="url(#stone-dark)" stroke-width="28" stroke-linecap="butt"
        d="M420 560 C420 560 520 375 800 375 C1080 375 1180 560 1180 560"/>
  <path fill="none" stroke="#e4be9e" stroke-width="6" opacity="0.7"
        d="M435 555 C435 555 530 390 800 390 C1070 390 1165 555 1165 555"/>

  <!-- voussoir marks -->
  <g stroke="#71697a" stroke-width="1.5" opacity="0.35">
    <path d="M500 470 L515 445"/>
    <path d="M580 410 L590 385"/>
    <path d="M700 380 L705 355"/>
    <path d="M800 375 L800 350"/>
    <path d="M900 380 L895 355"/>
    <path d="M1020 410 L1010 385"/>
    <path d="M1100 470 L1085 445"/>
  </g>

  <!-- deck -->
  <rect x="220" y="545" width="1160" height="28" fill="url(#stone)" stroke="#71697a" stroke-width="1.5"/>
  <g stroke="#71697a" stroke-width="1" opacity="0.3">
    <line x1="320" y1="545" x2="320" y2="573"/>
    <line x1="420" y1="545" x2="420" y2="573"/>
    <line x1="520" y1="545" x2="520" y2="573"/>
    <line x1="620" y1="545" x2="620" y2="573"/>
    <line x1="720" y1="545" x2="720" y2="573"/>
    <line x1="820" y1="545" x2="820" y2="573"/>
    <line x1="920" y1="545" x2="920" y2="573"/>
    <line x1="1020" y1="545" x2="1020" y2="573"/>
    <line x1="1120" y1="545" x2="1120" y2="573"/>
    <line x1="1220" y1="545" x2="1220" y2="573"/>
    <line x1="1320" y1="545" x2="1320" y2="573"/>
  </g>

  <!-- parapet -->
  <rect x="230" y="528" width="1140" height="10" fill="#cbbfa3" stroke="#71697a" stroke-width="1"/>
  <g fill="#d9d2b6" stroke="#71697a" stroke-width="1">
    <rect x="280" y="505" width="14" height="24"/>
    <rect x="380" y="505" width="14" height="24"/>
    <rect x="480" y="505" width="14" height="24"/>
    <rect x="580" y="505" width="14" height="24"/>
    <rect x="680" y="505" width="14" height="24"/>
    <rect x="780" y="505" width="14" height="24"/>
    <rect x="880" y="505" width="14" height="24"/>
    <rect x="980" y="505" width="14" height="24"/>
    <rect x="1080" y="505" width="14" height="24"/>
    <rect x="1180" y="505" width="14" height="24"/>
    <rect x="1280" y="505" width="14" height="24"/>
  </g>

  <!-- keystone -->
  <path fill="#e4be9e" stroke="#71697a" stroke-width="1.5" d="M780 348 L820 348 L830 390 L770 390 Z"/>
</svg>
